<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/heic2any/dist/heic2any.min.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/loader.js"></script>
    <link href="css/style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <style>
        .polaroid {
            position: relative;
            padding: 10px 10px 25px;
            background: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            text-align: center;
        }
        .polaroid img {
            width: 100%;
            height: auto;
        }
        .caption {
            margin-top: 10px;
            font-size: 14px;
            color: #333;
        }
        .sticky-sidebar {
            position: -webkit-sticky;
            position: sticky;
            top: 20px;
            padding: 20px;
            background-color: #6d2cae; /* Mismo color que el navbar */
            border-radius: 15px; /* Bordes redondeados */
            color: white;
        }
        .sticky-sidebar .nav-link {
            color: white;
            margin-bottom: 10px;
        }
        .sticky-sidebar .nav-link.active {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-custom navbar-mainbg">
        <a class="navbar-brand navbar-logo" href="#">VIVA History book</a>
        <button class="navbar-toggler" type="button" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <i class="fas fa-bars text-white"></i>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto">
                <div class="hori-selector"><div class="left"></div><div class="right"></div></div>
                <!-- Navbar items will be loaded here -->
            </ul>
        </div>
    </nav>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-3">
                <div class="sticky-sidebar">
                    <ul class="nav flex-column">
                        <!-- Sidebar items will be loaded here -->
                    </ul>
                </div>
            </div>
            <div class="col-md-9">
                <div id="aventuras-content">
                    <!-- Aventuras content will be loaded here -->
                </div>
            </div>
        </div>
    </div>
</body>
</html>
